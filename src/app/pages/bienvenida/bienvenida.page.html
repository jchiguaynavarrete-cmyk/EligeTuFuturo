<!--
  Pantalla de entrada. Solo presenta la app y reparte hacia /auth:
  no lleva formulario, para no duplicar la lógica de login que ya existe.
-->
<ion-content fullscreen="true" class="bienvenida">
  <!--
    Fondo fotográfico. La foto trae a los estudiantes a la derecha y zona
    oscura a la izquierda, así que el texto se apoya en ese lado. El velo
    encima es lo que garantiza que se lea: sin él, el texto blanco se pierde
    sobre las zonas claras de la imagen.
  -->
  <div class="fondo" aria-hidden="true">
    <picture>
      <source srcset="/assets/bienvenida-estudiantes.webp" type="image/webp" />
      <img class="foto" src="/assets/bienvenida-estudiantes.jpg" alt="" decoding="async" />
    </picture>
    <span class="velo"></span>
  </div>

  <div class="lienzo">
    <!-- Marca: siempre arriba del todo -->
    <div class="marca">
      <span class="marca-logo" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="40" height="40">
          <defs>
            <linearGradient id="logoDeg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#8b5cf6" />
              <stop offset="55%" stop-color="#4f7cff" />
              <stop offset="100%" stop-color="#22d3ee" />
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="44" height="44" rx="14" fill="url(#logoDeg)" />
          <!-- Birrete simplificado -->
          <path d="M24 14 L37 20 L24 26 L11 20 Z" fill="#fff" opacity="0.96" />
          <path
            d="M16.5 22.5 V29 c0 0 3.2 3.2 7.5 3.2 S31.5 29 31.5 29 V22.5"
            fill="none"
            stroke="#fff"
            stroke-width="2.6"
            stroke-linecap="round"
            opacity="0.96" />
          <path d="M37 20 V30" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />
        </svg>
      </span>
      <span class="marca-nombre">Elige<em>Tu</em>Futuro</span>
    </div>

    <!--
      Los tres bloques van sueltos para poder reordenarlos por CSS.
      En escritorio se leen en este orden; en móvil la acción sube por
      delante de los beneficios (ver el bloque responsive del .scss).
    -->
    <section class="panel-texto">
      <div class="bloque-mensaje">
        <h1 class="titulo">Tu futuro comienza con una buena elección</h1>

        <p class="bajada">
          Descubre carreras, compara instituciones y encuentra la opción que
          mejor se adapte a ti.
        </p>
      </div>

      <ul class="ventajas">
        <li *ngFor="let ventaja of ventajas">
          <span class="ventaja-icono" aria-hidden="true">
            <ion-icon [name]="ventaja.icono"></ion-icon>
          </span>
          <span class="ventaja-texto">{{ ventaja.texto }}</span>
        </li>
      </ul>

      <!--
        Bifurcación: el estudiante va al registro de siempre; la institución
        va a una landing pública, sin pedirle cuenta. Son dos públicos con
        necesidades distintas y conviene separarlos antes de pedir datos.
      -->
      <div class="bloque-accion">
        <ion-button expand="block" class="btn-comenzar" (click)="comenzar()">
          Soy Estudiante
        </ion-button>

        <ion-button
          expand="block"
          fill="outline"
          class="btn-institucion"
          (click)="soyInstitucion()">
          Soy Institución / Sostenedor
        </ion-button>

        <p class="pie">
          ¿Ya tienes una cuenta?
          <button type="button" class="enlace" (click)="iniciarSesion()">
            Inicia sesión
          </button>
        </p>
      </div>
    </section>
  </div>
</ion-content>
